<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beshoy Yasser — Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0e0d0f; --bg-alt:#151316; --red:#e8332c; --cream:#f2ede6;
    --muted:#9a9498; --line:rgba(242,237,230,0.14);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;margin:0;padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{background:var(--bg);color:var(--cream);}
  body{font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.5;}
  h1,h2,.num{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:0.02em;}
  img{max-width:100%;}
  a{color:inherit;}
  section{padding:5.5rem 1.5rem;max-width:1100px;margin:0 auto;}

  /* HERO */
  .hero{min-height:92svh;display:flex;align-items:center;gap:3rem;flex-wrap:wrap;perspective:1200px;}
  .hero-text{flex:1;min-width:280px;}
  .hero-text h1{font-size:clamp(3.2rem,10vw,7.5rem);line-height:0.92;color:var(--cream);}
  .hero-text p{margin-top:1.1rem;color:var(--muted);font-size:1.05rem;max-width:34ch;}
  .hero-photo-wrap{flex:0 0 520px;max-width:100%;}
  .hero-photo{position:relative;width:520px;max-width:90vw;transform-style:preserve-3d;transition:transform .15s ease-out;border:1px solid var(--line);}
  .hero-photo img{display:block;width:100%;}
  .scroll-cue{position:absolute;bottom:2rem;left:1.5rem;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.5rem;}
  .scroll-cue span{display:inline-block;width:1px;height:22px;background:var(--muted);animation:down 1.8s infinite;}
  @keyframes down{0%{transform:scaleY(0);transform-origin:top;}50%{transform:scaleY(1);transform-origin:top;}50.01%{transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}

  /* STATS */
  .stats{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;}
  .stat{flex:1;min-width:150px;padding:2.5rem 1.5rem;border-left:1px solid var(--line);}
  .stat:first-child{border-left:none;}
  .stat .num{font-size:4rem;color:var(--red);line-height:1;}
  .stat .label{color:var(--muted);font-size:.95rem;margin-top:.3rem;}

  /* CATEGORIES */
  .cat-head{font-size:.9rem;color:var(--muted);margin-bottom:1.5rem;}
  .cat-row{border-bottom:1px solid var(--line);}
  .cat-row summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:1.6rem .2rem;cursor:pointer;}
  .cat-row summary::-webkit-details-marker{display:none;}
  .cat-row summary h2{font-size:2.2rem;color:var(--cream);}
  .cat-row summary .meta{display:flex;align-items:center;gap:1rem;color:var(--muted);font-size:.9rem;}
  .cat-row summary .chev{transition:transform .2s;}
  .cat-row[open] summary .chev{transform:rotate(45deg);}
  .cat-body{padding:0 .2rem 1.6rem;}
  .vid-item{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--line);font-size:.95rem;}
  .vid-item a{color:var(--cream);text-decoration:none;}
  .vid-item a:hover{color:var(--red);}
  .empty{color:var(--muted);font-size:.9rem;padding:.7rem 0;border-top:1px solid var(--line);}
  .rm{color:var(--muted);font-size:.8rem;cursor:pointer;background:none;border:none;font-family:inherit;}
  .rm:hover{color:var(--red);}

  footer{padding:3rem 1.5rem;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);}

  /* ADMIN */
  .lock{position:fixed;right:1.2rem;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;background:var(--bg-alt);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;z-index:50;}
  .contact-stack{position:fixed;left:1.2rem;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.7rem;z-index:50;}
  .contact-btn{width:44px;height:44px;border-radius:50%;background:var(--bg-alt);border:1px solid var(--line);color:var(--cream);display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .contact-btn:hover{border-color:var(--red);color:var(--red);}
  .panel{position:fixed;right:1.2rem;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));width:min(320px,85vw);background:var(--bg-alt);border:1px solid var(--line);padding:1.2rem;z-index:50;display:none;}
  .panel.open{display:block;}
  .panel label{display:block;font-size:.8rem;color:var(--muted);margin:.6rem 0 .3rem;}
  .panel input,.panel select{width:100%;padding:.55rem .6rem;background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:3px;font-family:inherit;font-size:.9rem;}
  .panel button{margin-top:1rem;width:100%;padding:.6rem;background:var(--red);border:none;color:var(--cream);border-radius:3px;cursor:pointer;font-family:inherit;font-size:.9rem;}
  .panel .status{margin-top:.6rem;font-size:.8rem;color:var(--muted);min-height:1.1em;}
  .panel .close-x{position:absolute;top:.7rem;right:.9rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;}
</style>
</head>

function renderCats(){
  const list = document.getElementById('catList');
  list.innerHTML = '';
  DATA.categories.forEach(cat=>{
    const vids = DATA.videos[cat] || [];
    const row = document.createElement('details');
    row.className = 'cat-row';
    const isAdmin = document.getElementById('adminView').style.display !== 'none';
    let bodyHtml = '';
    if(vids.length){
      bodyHtml = vids.map((v,i)=>`<div class="vid-item"><a href="${escAttr(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>${isAdmin?`<button class="rm" data-cat="${escAttr(cat)}" data-i="${i}">remove</button>`:''}</div>`).join('');
    } else {
      bodyHtml = `<div class="empty">No videos in this category yet.</div>`;
    }
    row.innerHTML = `<summary><h2>${esc(cat)}</h2><span class="meta">${vids.length} video${vids.length===1?'':'s'}<span class="chev">+</span></span></summary><div class="cat-body">${bodyHtml}</div>`;
    list.appendChild(row);
  });
  list.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.preventDefault();
      const cat = btn.dataset.cat, i = parseInt(btn.dataset.i);
      DATA.videos[cat].splice(i,1);
      renderCats();
      persist('adminStatus');
    });
  });
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escAttr(s){return esc(s);}

async function persist(statusId){
  const el = document.getElementById(statusId);
  document.getElementById('data-json').textContent = JSON.stringify(DATA);
  if(!db){ if(el) el.textContent = 'Could not connect to the database.'; return; }
  try{
    if(el) el.textContent = 'Saving…';
    await db.collection('portfolio').doc('data').set({videos: DATA.videos});
    if(el) el.textContent = 'Saved.';
  }catch(err){
    if(el) el.textContent = 'Could not save (' + (err && err.code ? err.code : 'error') + ').';
  }
}

// tilt effect
const photo = document.getElementById('tiltPhoto');
const hero = document.getElementById('hero');
hero.addEventListener('mousemove', (e)=>{
  const r = photo.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const dx = (e.clientX - cx) / r.width, dy = (e.clientY - cy) / r.height;
  photo.style.transform = `rotateY(${dx*14}deg) rotateX(${-dy*14}deg)`;
});
hero.addEventListener('mouseleave', ()=>{ photo.style.transform = 'rotateY(0) rotateX(0)'; });

// admin panel
const lockBtn = document.getElementById('lockBtn');
const panel = document.getElementById('panel');
lockBtn.addEventListener('click', ()=> panel.classList.toggle('open'));
document.getElementById('closeX').addEventListener('click', ()=> panel.classList.remove('open'));
document.getElementById('pwBtn').addEventListener('click', ()=>{
  const val = document.getElementById('pw').value;
  if(val === PASSWORD){
    document.getElementById('lockedView').style.display = 'none';
    document.getElementById('adminView').style.display = 'block';
    const sel = document.getElementById('catSel');
    sel.innerHTML = DATA.categories.map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join('');
    renderCats();
  } else {
    document.getElementById('pwStatus').textContent = 'Wrong password.';
  }
});
document.getElementById('addBtn').addEventListener('click', ()=>{
  const cat = document.getElementById('catSel').value;
  const title = document.getElementById('vTitle').value.trim();
  const url = document.getElementById('vUrl').value.trim();
  if(!title || !url){ document.getElementById('adminStatus').textContent = 'Add a title and a link.'; return; }
  DATA.videos[cat] = DATA.videos[cat] || [];
  DATA.videos[cat].push({title,url});
  document.getElementById('vTitle').value = '';
  document.getElementById('vUrl').value = '';
  renderCats();
  persist('adminStatus');
});

loadData();
</script>
